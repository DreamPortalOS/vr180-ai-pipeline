<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quest 穹顶 VR 模拟器 — Dome XR</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    :root { --xr-bg: #0b0d12; --xr-panel: #15192299; --xr-accent: #4cc2ff; }
    html, body { height: 100%; margin: 0; background: var(--xr-bg); color: #e6e8ee;
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    #xr-app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
    #xrSidebar { overflow: auto; padding: 14px; border-right: 1px solid #23283677;
      background: linear-gradient(180deg, #11141c, #0b0d12); }
    #xrStage { position: relative; }
    #xrCanvas { display: block; width: 100%; height: 100%; background: #000; touch-action: none; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    .sub { color: #8b93a7; font-size: 12px; margin: 0 0 14px; }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #8b93a7; margin: 18px 0 8px; }
    label.field { display: block; margin: 8px 0; }
    label.field > span { display: block; color: #aab2c5; margin-bottom: 4px; }
    select, input[type="number"] { width: 100%; box-sizing: border-box; padding: 6px 8px;
      background: #0e1118; color: #e6e8ee; border: 1px solid #2a3142; border-radius: 8px; }
    .file-btn { display: inline-block; padding: 8px 12px; background: #1a2030; border: 1px solid #2a3142;
      border-radius: 8px; cursor: pointer; }
    .file-btn input { display: none; }
    #xrSourceList { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow: auto; }
    #xrSourceList li { padding: 8px 10px; border: 1px solid #23283677; border-radius: 8px;
      margin-bottom: 6px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
    #xrSourceList li:hover { background: #182030; }
    #xrSourceList li.selected { border-color: var(--xr-accent); background: #11283a; }
    #xrSourceList .thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; background: #000; }
    #xrSourceList .meta { flex: 1; min-width: 0; }
    #xrSourceList .name { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #xrSourceList .kind { font-size: 11px; color: #8b93a7; }
    #btnEnterVR { width: 100%; box-sizing: border-box; margin-top: 14px; padding: 14px;
      font-size: 15px; font-weight: 600; color: #04121d; background: var(--xr-accent);
      border: none; border-radius: 10px; cursor: pointer; }
    #btnEnterVR:disabled { background: #2a3142; color: #6b7385; cursor: not-allowed; }
    #xrStatus { position: absolute; top: 10px; left: 10px; right: 10px; pointer-events: none;
      font-size: 12px; color: #c8d0e0; text-shadow: 0 1px 4px #000; }
    #xrHint { position: absolute; bottom: 10px; left: 10px; right: 10px; pointer-events: none;
      font-size: 12px; color: #8b93a7; text-shadow: 0 1px 4px #000; }
    .err { color: #ff8b8b; }
  </style>
</head>
<body>
  <div id="xr-app">
    <aside id="xrSidebar">
      <h1>Quest 穹顶 VR 模拟器</h1>
      <p class="sub">在球幕影厅里检查 domemaster 母版的映射。Quest 浏览器打开本页 → 进入 VR。</p>

      <h2>母版</h2>
      <ul id="xrSourceList"></ul>
      <label class="file-btn" for="xrFile">⬆ 上传母版
        <input id="xrFile" type="file" accept="image/png,image/jpeg,image/webp,video/mp4,video/quicktime,video/webm" hidden />
      </label>

      <h2>穹顶</h2>
      <label class="field"><span>倾角</span>
        <select id="xrTilt">
          <option value="0">0° 天象馆（正头顶）</option>
          <option value="15">15° 倾斜影院</option>
          <option value="30" selected>30° 倾斜影院</option>
          <option value="custom">自定义…</option>
        </select>
      </label>
      <label class="field" id="xrTiltCustomWrap" hidden><span>自定义倾角（度）</span>
        <input id="xrTiltCustom" type="number" min="-45" max="45" step="5" value="20" />
      </label>
      <label class="field"><span>座位</span>
        <select id="xrSeat">
          <option value="center" selected>中心（球心）</option>
          <option value="rear">后排（1/3 半径）</option>
          <option value="front">前排</option>
        </select>
      </label>
      <label class="field"><span>穹顶半径（米）</span>
        <input id="xrRadius" type="number" min="3" max="20" step="1" value="8" />
      </label>

      <button id="btnEnterVR" type="button" disabled>进入 VR</button>
      <p class="sub" style="margin-top:10px" id="xrEnterHint">选择一个母版后进入 VR；非 VR 浏览器将进入 2D 环视模式。</p>
    </aside>

    <main id="xrStage">
      <canvas id="xrCanvas"></canvas>
      <div id="xrStatus"></div>
      <div id="xrHint"></div>
    </main>
  </div>
  <script src="/xr/dome_xr_proj.js"></script>
  <script src="/xr/dome_xr.js"></script>
</body>
</html>
