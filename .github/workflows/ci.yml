name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# 同一分支的旧跑批直接取消，省 runner 时间，也避免评审门看到过期的 pending。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # 版本必须与 .pre-commit-config.yaml 的 ruff rev 一致，否则本地绿 CI 红。
      - run: pip install ruff==0.15.18
      - run: ruff check pipeline/ scripts/ tests/
      - run: ruff format --check pipeline/ scripts/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -m "not slow" --tb=short
